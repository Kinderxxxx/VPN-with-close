---
# Базовая подготовка VPN-ноды (Ubuntu 22.04/24.04, Debian 12).
# Запуск:  ansible-playbook node.yml --skip-tags ssh     (первый раз)
#          ansible-playbook node.yml --tags ssh          (после проверки входа под admin_user)
- name: Базовая настройка VPN-ноды
  hosts: nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Проверить, что ОС поддерживается
      ansible.builtin.assert:
        that: ansible_distribution in ['Ubuntu', 'Debian']
        fail_msg: "Плейбук рассчитан на Ubuntu или Debian, а на {{ inventory_hostname }} {{ ansible_distribution }}."
      tags: always

    - name: Проверить, что указан публичный SSH-ключ (защита от блокировки доступа)
      ansible.builtin.assert:
        that: admin_ssh_pubkey is match('^(ssh-|ecdsa-|sk-)')
        fail_msg: "Укажите свой публичный ключ в group_vars/all.yml (admin_ssh_pubkey)."
      tags: always

  tasks:
    # ---------- 1. Пакеты и время ----------
    - name: Обновить кэш пакетов и безопасно обновить систему
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      tags: [base]

    - name: Установить базовые пакеты
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - chrony
          - unattended-upgrades
          - htop
          - iftop
          - jq
        state: present
      tags: [base]

    - name: Установить часовой пояс
      community.general.timezone:
        name: "{{ timezone }}"
      tags: [base]

    - name: Включить синхронизацию времени (chrony)
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      tags: [base]

    - name: Включить автоматические обновления безопасности (без автоперезагрузки)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"
      tags: [base]

    # ---------- 2. Админ-пользователь ----------
    - name: Создать админ-пользователя
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        password_lock: true
      tags: [user]

    - name: Добавить SSH-ключ админ-пользователю
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_pubkey }}"
        state: present
      tags: [user]

    - name: Разрешить sudo без пароля (вход только по ключу, пароля у пользователя нет)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
      tags: [user]

    # ---------- 3. Файрвол ----------
    - name: UFW - запретить входящие по умолчанию
      community.general.ufw:
        default: deny
        direction: incoming
      tags: [firewall]

    - name: UFW - разрешить исходящие по умолчанию
      community.general.ufw:
        default: allow
        direction: outgoing
      tags: [firewall]

    - name: UFW - разрешить SSH (порт 22)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      tags: [firewall]

    - name: UFW - открыть публичные порты VPN
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop: "{{ firewall_public_ports }}"
      tags: [firewall]

    - name: UFW - открыть порты управления только для IP панели
      community.general.ufw:
        rule: allow
        from_ip: "{{ panel_ip }}"
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_panel_ports }}"
      when: panel_ip | length > 0
      tags: [firewall]

    - name: UFW - включить
      community.general.ufw:
        state: enabled
      tags: [firewall]

    # ---------- 4. Fail2ban ----------
    - name: Настроить fail2ban для SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: |
          [DEFAULT]
          ignoreip = {{ fail2ban_ignore_ips | join(' ') }}

          [sshd]
          enabled = true
          backend = systemd
          maxretry = 4
          findtime = 10m
          bantime = 1h
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban
      tags: [firewall]

    - name: Включить fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
      tags: [firewall]

    # ---------- 5. Тюнинг ядра и лимиты ----------
    - name: Загружать модуль conntrack при старте системы
      ansible.builtin.copy:
        dest: /etc/modules-load.d/nf_conntrack.conf
        content: "nf_conntrack\n"
        owner: root
        group: root
        mode: "0644"
      tags: [tuning]

    - name: Загрузить модуль conntrack сейчас
      community.general.modprobe:
        name: nf_conntrack
        state: present
      tags: [tuning]

    - name: Применить тюнинг ядра (BBR, очереди, буферы, conntrack)
      ansible.builtin.template:
        src: 99-vpn-tuning.conf.j2
        dest: /etc/sysctl.d/99-vpn-tuning.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl
      tags: [tuning]

    - name: Поднять лимит открытых файлов для пользовательских сессий
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-nofile.conf
        content: |
          *    soft nofile 1048576
          *    hard nofile 1048576
          root soft nofile 1048576
          root hard nofile 1048576
        owner: root
        group: root
        mode: "0644"
      tags: [tuning]

    - name: Создать каталог для systemd-настроек по умолчанию
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [tuning]

    - name: Поднять лимит открытых файлов для служб systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/99-nofile.conf
        content: |
          [Manager]
          DefaultLimitNOFILE=1048576
        owner: root
        group: root
        mode: "0644"
      notify: Reexec systemd
      tags: [tuning]

    # ---------- 6. Docker ----------
    - name: Создать каталог для ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: install_docker | bool
      tags: [docker]

    - name: Скачать GPG-ключ репозитория Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      when: install_docker | bool
      tags: [docker]

    - name: Добавить репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
      when: install_docker | bool
      tags: [docker]

    - name: Установить Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: install_docker | bool
      tags: [docker]

    - name: Настроить Docker (ротация логов, live-restore)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" },
            "live-restore": true
          }
        owner: root
        group: root
        mode: "0644"
      when: install_docker | bool
      notify: Restart docker
      tags: [docker]

    - name: Включить Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: install_docker | bool
      tags: [docker]

    # ---------- 7. SSH-хардинг (запускать ПОСЛЕ проверки входа под admin_user) ----------
    - name: Проверить, что sshd читает каталог sshd_config.d
      ansible.builtin.command: grep -qE '^\s*Include\s+/etc/ssh/sshd_config.d/' /etc/ssh/sshd_config
      changed_when: false
      tags: [ssh]

    - name: Применить SSH-хардинг с откатом при ошибке
      tags: [ssh]
      block:
        - name: Положить конфиг (только ключи, без root, только admin_user)
          ansible.builtin.template:
            src: 00-hardening.conf.j2
            dest: /etc/ssh/sshd_config.d/00-hardening.conf
            owner: root
            group: root
            mode: "0644"
          notify: Reload sshd

        - name: Проверить синтаксис конфига sshd
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
      rescue:
        - name: Откатить сломанный конфиг
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/00-hardening.conf
            state: absent

        - name: Остановить плейбук
          ansible.builtin.fail:
            msg: "Конфиг sshd оказался некорректным. Изменения откачены, доступ не потерян."

    # ---------- 8. Проверка результата ----------
    - name: Прочитать алгоритм управления перегрузкой
      ansible.builtin.command: sysctl -n net.ipv4.tcp_congestion_control
      register: cc_result
      changed_when: false
      tags: [verify]

    - name: Проверить, нужна ли перезагрузка
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag
      tags: [verify]

    - name: Итог по ноде
      ansible.builtin.debug:
        msg:
          - "TCP congestion control: {{ cc_result.stdout }} (ожидается bbr)"
          - "{{ 'Нужна перезагрузка: sudo reboot' if reboot_flag.stat.exists else 'Перезагрузка не требуется' }}"
          - "Лимиты nofile вступят в силу после ближайшей перезагрузки"
      tags: [verify]

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl --system

    - name: Reexec systemd
      ansible.builtin.command: systemctl daemon-reexec

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
